<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="title"
      content="Chirag Berde | Frontend Web Developer Portfolio"
    />
    <meta
      name="description"
      content="Explore the portfolio of Chirag Berde, a passionate Frontend Developer specializing in modern web development, React, Next.js, and building scalable web applications."

    <meta
      name="keywords"
      content="Chirag Berde, Web Developer, Frontend Developer, React Developer, Software Engineer, Portfolio"

    <link rel="icon" type="image/svg+xml" href="/cb-favicon.png" />
    <link rel="apple-touch-icon" href="/cb-favicon.png" />
    <style>
      .preloader {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background-color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      .cb-loader {
        font-size: 2.5rem;
        font-weight: 700;
        animation: rotateCB 1.2s linear infinite;
        letter-spacing: -5px;
      }

      .text-gray-2 {
        color: #a0a0a0;
      }

      .text-black {
        color: #000000;
      }

      @keyframes rotateCB {
        from {
          transform: rotate(0deg);
        }

        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="preloader">
        <div class="cb-loader">
          <span class="text-gray-2">C</span>
          <span class="text-black">B</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
